name: coffeecard
description: Cafe Analog Coffee card

publish_to: "none"

# Build pipeline will overwrite this
version: 0.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: 3.41.7

dependencies:
  flutter:
    sdk: flutter

  # ui
  gap: 3.0.1
  shimmer: 3.0.0
  animations: ^2.1.2
  dotted_border: ^3.1.0
  flutter_layout_grid: ^2.0.8
  cached_network_image: 3.4.1

  # Chopper api and rest client
  logger: ^2.7.0
  chopper: ^8.5.1

  # storage
  flutter_secure_storage: ^10.0.0
  hive: 2.2.3
  hive_flutter: 1.1.0

  # dependency injection
  get_it: ^9.2.1

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  stream_transform: 2.1.1
  provider: ^6.1.5+1

  # Utility
  meta: ^1.17.0
  equatable: ^2.0.8
  collection: 1.19.1

  # Internationalization and date formatting
  intl: 0.20.2

  # Url Launcher
  url_launcher: ^6.3.2

  # crypto
  crypto: ^3.0.7

  # rest
  http: ^1.6.0

  # brightness
  screen_brightness: ^2.1.7

  # functional programming thingies
  fpdart: ^1.2.0

  # Upgrade notifier
  upgrader: ^13.0.0

  # env
  envied: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  # unit testing
  mockito: ^5.6.4
  bloc_test: 10.0.0

  # Chopper api and rest client
  chopper_generator: ^8.6.1
  json_serializable: ^6.11.2
  swagger_dart_code_generator: ^4.1.1

  # linter
  lint: 2.8.0

  # env
  envied_generator: ^1.3.4

# update splash screen:
# flutter pub run flutter_native_splash:create
# OR
# make splash
flutter_native_splash:
  color: "#362619"
  android_12:
    color: "#E5E2D7"

# update launcher icon:
# flutter pub run flutter_launcher_icons:main
# OR
# make icon
# WARNING! Don't run this command unless you are sure what you are doing.
# flutter_icons:
#   android: true
#   ios: true
#   remove_alpha_ios: true
#   image_path: "assets/icon/Icon.png"
#   adaptive_icon_background: "assets/icon/Background.png"
#   adaptive_icon_foreground: "assets/icon/Foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/profile_icons/

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/roboto_flex/RobotoFlex.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/roboto_mono/RobotoMono-Regular.ttf
        - asset: assets/fonts/roboto_mono/RobotoMono-Bold.ttf
          weight: 700
    - family: AnalogIcons
      fonts:
        - asset: assets/fonts/AnalogIcons.ttf
